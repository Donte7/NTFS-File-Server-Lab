# ============================================================
# NTFS File Server Lab — CI/CD Pipeline
# GitHub Actions workflow for automated infrastructure deployment
#
# Triggers:
#   Push to main     -> full deploy (plan + apply)
#   Pull Request     -> plan only (no apply, no infrastructure changes)
#   Manual dispatch  -> choose deploy or destroy
#
# Required GitHub Secrets (Settings -> Secrets -> Actions):
#   ARM_CLIENT_ID          Azure Service Principal app ID
#   ARM_CLIENT_SECRET      Azure Service Principal secret
#   ARM_SUBSCRIPTION_ID    Azure subscription I
#   ARM_TENANT_ID          Azure AD tenant ID
#   TF_VAR_admin_password  VM admin password (12+ chars, upper+lower+number+symbol)
#   RDP_SOURCE_IP          Your IP in CIDR format, e.g. 1.2.3.4/32
# ============================================================

name: NTFS Lab — Deploy Infrastructure

on:
  push:
    branches:
      - main
    paths:
      - "**.tf"
      - "**.ps1"
      - ".github/workflows/deploy.yml"

  pull_request:
    branches:
      - main
    paths:
      - "**.tf"
      - "**.ps1"

  workflow_dispatch:
    inputs:
      action:
        description: "Action to perform"
        required: true
        default: "deploy"
        type: choice
        options:
          - deploy
          - destroy

env:
  TF_VERSION: "1.5.0"
  ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
  TF_VAR_admin_password: ${{ secrets.TF_VAR_admin_password }}

jobs:
  # ============================================================
  # JOB 1 — VALIDATE
  # Runs on every push and PR.
  # Checks formatting, syntax, and security before any changes.
  # ============================================================
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform format check
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Post format result
        if: steps.fmt.outcome == 'failure'
        run: |
          echo "::warning::Terraform files are not formatted correctly."
          echo "Run 'terraform fmt -recursive' locally to fix."

      - name: Terraform init (validate only)
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

      - name: Summary
        run: |
          echo "## Validation Results" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Format | ${{ steps.fmt.outcome == 'success' && '✅ Pass' || '⚠️ Needs formatting' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Validate | ✅ Pass |" >> "$GITHUB_STEP_SUMMARY"

  # ============================================================
  # JOB 2 — PLAN
  # Runs after validate passes.
  # Shows exactly what Terraform will create/change/destroy.
  # Runs on PRs AND pushes to main — never makes real changes.
  # ============================================================
  plan:
    name: Plan
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.ARM_CLIENT_ID }}",
              "clientSecret": "${{ secrets.ARM_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.ARM_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.ARM_TENANT_ID }}"
            }

      - name: Terraform init
        run: terraform init

      - name: Write tfvars for pipeline
        run: |
          cat > pipeline.auto.tfvars << EOF
          location       = "Central US"
          server_vm_size = "Standard_D2s_v3"
          client_vm_size = "Standard_D2s_v3"
          rdp_source     = "${{ secrets.RDP_SOURCE_IP }}"
          EOF

      - name: Terraform plan
        id: plan
        env:
          TF_VAR_admin_password: ${{ secrets.TF_VAR_admin_password }}
        run: |
          terraform plan \
            -out=tfplan \
            -no-color \
            -input=false \
            2>&1 | tee plan_output.txt

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: tfplan
          retention-days: 1

      - name: Post plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const planOutput = fs.readFileSync('plan_output.txt', 'utf8');
            const maxLength = 60000;
            const truncated = planOutput.length > maxLength
              ? planOutput.substring(0, maxLength) + '\n\n... (truncated)'
              : planOutput;

            const body = `## Terraform Plan
            \`\`\`terraform
            ${truncated}
            \`\`\`
            *Triggered by: @${{ github.actor }} on \`${{ github.head_ref }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Plan summary
        run: |
          echo "## Terraform Plan Summary" >> "$GITHUB_STEP_SUMMARY"
          grep -E "^Plan:|will be created|will be destroyed|will be updated" plan_output.txt >> "$GITHUB_STEP_SUMMARY" || true

  # ============================================================
  # JOB 3 — DEPLOY
  # Runs ONLY on push to main — NOT on PRs.
  # Applies the exact plan produced in the plan job.
  # ============================================================
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: plan
    if: |
      github.event_name == 'push' && github.ref == 'refs/heads/main' ||
      github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'deploy'
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.ARM_CLIENT_ID }}",
              "clientSecret": "${{ secrets.ARM_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.ARM_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.ARM_TENANT_ID }}"
            }

      - name: Terraform init
        run: terraform init

      - name: Write tfvars for pipeline
        run: |
          cat > pipeline.auto.tfvars << EOF
          location       = "Central US"
          server_vm_size = "Standard_D2s_v3"
          client_vm_size = "Standard_D2s_v3"
          rdp_source     = "${{ secrets.RDP_SOURCE_IP }}"
          EOF

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan

      - name: Terraform apply
        env:
          TF_VAR_admin_password: ${{ secrets.TF_VAR_admin_password }}
        run: |
          terraform apply \
            -auto-approve \
            -input=false \
            tfplan

      - name: Capture outputs
        id: outputs
        run: |
          echo "client01_ip=$(terraform output -raw client01_public_ip)" >> "$GITHUB_OUTPUT"
          echo "dc01_ip=$(terraform output -raw dc01_public_ip)" >> "$GITHUB_OUTPUT"
          echo "fs01_ip=$(terraform output -raw fs01_public_ip)" >> "$GITHUB_OUTPUT"
          echo "kv_name=$(terraform output -raw key_vault_name)" >> "$GITHUB_OUTPUT"

      - name: Deploy summary
        run: |
          echo "## Deployment Complete" >> "$GITHUB_STEP_SUMMARY"
          echo "| Resource | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| CLIENT01 IP | \`${{ steps.outputs.outputs.client01_ip }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| DC01 IP | \`${{ steps.outputs.outputs.dc01_ip }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| FS01 IP | \`${{ steps.outputs.outputs.fs01_ip }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Key Vault | \`${{ steps.outputs.outputs.kv_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Next step:** Run \`configure-lab.ps1 -KeyVaultName ${{ steps.outputs.outputs.kv_name }}\` to configure the lab." >> "$GITHUB_STEP_SUMMARY"

  # ============================================================
  # JOB 4 — DESTROY
  # Only runs on manual workflow dispatch with action = destroy.
  # Requires explicit manual trigger — never runs automatically.
  # ============================================================
  destroy:
    name: Destroy
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.ARM_CLIENT_ID }}",
              "clientSecret": "${{ secrets.ARM_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.ARM_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.ARM_TENANT_ID }}"
            }

      - name: Terraform init
        run: terraform init

      - name: Write tfvars for pipeline
        run: |
          cat > pipeline.auto.tfvars << EOF
          location       = "Central US"
          server_vm_size = "Standard_D2s_v3"
          client_vm_size = "Standard_D2s_v3"
          rdp_source     = "${{ secrets.RDP_SOURCE_IP }}"
          EOF

      - name: Terraform destroy
        env:
          TF_VAR_admin_password: ${{ secrets.TF_VAR_admin_password }}
        run: |
          terraform destroy \
            -auto-approve \
            -input=false

      - name: Destroy summary
        run: |
          echo "## Infrastructure Destroyed" >> "$GITHUB_STEP_SUMMARY"
          echo "All resources in RG-FileServerLab have been removed." >> "$GITHUB_STEP_SUMMARY"
          echo "Remote state in RG-TerraformState is preserved." >> "$GITHUB_STEP_SUMMARY"